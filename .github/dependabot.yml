# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Watches:
#   1. Python dependencies declared in pyproject.toml (Poetry) — "pip" ecosystem
#   2. GitHub Actions versions used in .github/workflows/*
version: 2
updates:
  # ---- Python dependencies (pyproject.toml / Poetry) ----
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Collapse routine minor/patch bumps into a single PR to cut noise.
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # ---- GitHub Actions used in workflows ----
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

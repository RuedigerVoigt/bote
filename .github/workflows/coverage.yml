name: Coverage Check

on: [push, pull_request]

jobs:
  coverage:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies and package
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-mock pyfakefs pytest-cov

    - name: Run tests with coverage check (minimum 95%)
      run: pytest --cov=bote --cov-fail-under=95

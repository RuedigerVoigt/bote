# This workflow runs Unit-Tests for bote on MacOS
# with the minimum and maximum supported Python versions.

name: MacOS Test

on: [push, pull_request]

jobs:
  build:

    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14', '3.15']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        # Needed to install Python 3.15 while it is a release candidate.
        allow-prereleases: true

    - name: Install Poetry and dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry
        poetry install --with dev

    - name: Test with pytest (Poetry)
      run: |
        poetry run pytest

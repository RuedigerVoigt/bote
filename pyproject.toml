[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "bote"
version = "2.0.0"
description = "Python SMTP client with enforced encryption for sending plain-text emails securely"
authors = [{name = "Rüdiger Voigt", email = "projects@ruediger-voigt.eu"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = ["email", "smtp", "smtp-client", "email-sender", "starttls", "ssl", "tls", "encryption", "security", "python-email", "secure-smtp", "notification", "alerts", "mailer", "automated-email"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: System :: Monitoring",
    "Topic :: Communications :: Email",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "compatibility>=2.2.0",
    "userprovided>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/RuedigerVoigt/bote"
Repository = "https://github.com/RuedigerVoigt/bote"
Documentation = "https://github.com/RuedigerVoigt/bote"
"Bug Tracker" = "https://github.com/RuedigerVoigt/bote/issues"
Changelog = "https://github.com/RuedigerVoigt/bote/blob/master/CHANGELOG.md"
"Source Code" = "https://github.com/RuedigerVoigt/bote"

[tool.poetry]
packages = [{include = "bote"}]
include = ["bote/py.typed"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-mock = "^3.15.1"
pytest-cov = "^7.1.0"
pyfakefs = "^6.2.0"
mypy = "^2.1.0"
ruff = "^0.15.17"
coverage = "^7.14.0"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Re-exports for the public API are intentional, not unused imports.
"bote/__init__.py" = ["F401"]
# pytest.raises blocks bind locals that are deliberately never read.
"tests/*" = ["F841"]
